[project]
name = "callyr"
version = "1.0.0"
description = "Cue — AI Honesty Guardian MCP Server. Real-time sycophancy and hallucination detection."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=3.4.7",
    "openai>=2.0.0",
    "supabase>=2.31.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

# Vercel loads the ASGI `app` from this module.
[tool.vercel]
entrypoint = "callyr.server:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# prompts/ is imported by callyr.detection, so it must ship as a package too.
packages = ["callyr", "prompts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
